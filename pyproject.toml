[project]
name = "nyc-taxi-data-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Le Nguyen", email = "nguyenbropmt@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
